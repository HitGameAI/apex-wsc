name: Test

on:
  push:
    branches: [master, refactor/fork-stable, main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    name: Linux Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.0', '1.26.x', '1.27.x']
    env:
      CGO_ENABLED: '1'
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        run: |
          gofmt -s -l . | tee "$RUNNER_TEMP/wsc-gofmt.txt"
          test ! -s "$RUNNER_TEMP/wsc-gofmt.txt"
      - name: Build
        run: go build -mod=readonly ./...
      - name: Verify module checksums
        run: go mod verify
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Run race tests on loopback
        run: |
          go test -mod=readonly -race -count=1 -timeout=120s \
            -exec="$GITHUB_WORKSPACE/.github/ci/run-wsc-tests-on-loopback" \
            -covermode=atomic -coverprofile="$RUNNER_TEMP/wsc-coverage.out" ./...
          test -s "$RUNNER_TEMP/wsc-coverage.out"
      - name: Verify module locks
        run: git diff --exit-code -- go.mod go.sum
